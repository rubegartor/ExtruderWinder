; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = giga_r1_m7

[env:giga_r1_m7]
platform = ststm32
framework = arduino
board = giga_r1_m7
board_build.arduino.flash_layout = 100_0
board_upload.maximum_size = 1966080
lib_deps =
	https://github.com/janelia-arduino/TMC51X0@^4.0.3
	Dlloydev/QuickPID@^3.1.9
	arduino-libraries/Arduino_GigaDisplayTouch@^1.0.1
	lvgl/lvgl@9.3.0
	teckel12/NewPing@^1.9.7
build_flags =
	-DCORE_M7
	-DLV_CONF_PATH='"${platformio.src_dir}/UI/lv_conf.h"'
	-Os
build_src_filter =
	+<*>
extra_scripts =
	pre:scripts/apply_h7_video_fix.py